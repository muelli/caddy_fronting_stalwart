---
# --- CONFIGURATION GUARDRAILS ---
- name: Fail if any Stalwart domain contains an invalid state definition
  fail:
    msg: "Security Guardrail: Stalwart Domain '{{ item.name }}' specifies an unrecognized state."
  loop: "{{ stalwart_domains }}"
  when: item.state not in ['present', 'absent']

# --- DIRECTORY & ENVIRONMENT PREPARATION ---
- name: Ensure Caddy configuration layout directories exist
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /etc/systemd/system/caddy.service.d
    - "{{ caddy_conf_dir }}"

- name: Provision DNS API keys into Caddy service environment
  template:
    src: templates/caddy-dns-env.conf.j2
    dest: /etc/systemd/system/caddy.service.d/override.conf
    owner: root
    group: root
    mode: '0600'
  notify:
    - Reload Systemd Daemon
    - Restart Caddy

- name: Generate Master Caddyfile configuration
  template:
    src: templates/Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: root
    mode: '0644'
  notify: Reload Caddy

- name: Ensure Stalwart cert destination directory exists
  file:
    path: "{{ stalwart_certs_dir }}"
    state: directory
    owner: "{{ stalwart_user }}"
    group: "{{ stalwart_group }}"
    mode: '0750'

# --- INCLUDE-BASED CADDY SITES DEPLOYMENT ---
- name: Remove absent domains from Caddy configurations
  file:
    path: "{{ caddy_conf_dir }}/{{ item.name }}.conf"
    state: absent
  loop: "{{ stalwart_domains + caddy_domains }}"
  when: item.state == 'absent'
  notify: Reload Caddy

- name: Deploy Caddy site includes for Stalwart mail backends
  template:
    src: templates/caddy-stalwart-site.j2
    dest: "{{ caddy_conf_dir }}/{{ item.name }}.conf"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ stalwart_domains }}"
  when: item.state == 'present'
  notify: Reload Caddy

- name: Deploy Caddy site includes for Standalone Web domains
  template:
    src: templates/caddy-standalone-site.j2
    dest: "{{ caddy_conf_dir }}/{{ item.name }}.conf"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ caddy_domains }}"
  when: item.state == 'present'
  notify: Reload Caddy

# --- SYSTEMD TEMPLATE UNITS FOR MAIL CERTIFICATES ---
- name: Deploy systemd template units (Service)
  template:
    src: templates/stalwart-cert-sync@.service.j2
    dest: /etc/systemd/system/stalwart-cert-sync@.service
    owner: root
    group: root
    mode: '0644'
  notify: Reload Systemd Daemon

- name: Deploy systemd template units (Path)
  template:
    src: templates/stalwart-cert-sync@.path.j2
    dest: /etc/systemd/system/stalwart-cert-sync@.path
    owner: root
    group: root
    mode: '0644'
  notify: Reload Systemd Daemon

- name: Deploy standalone Stalwart status-aware reloading manager
  template:
    src: templates/stalwart-reload.service.j2
    dest: /etc/systemd/system/stalwart-reload.service
    owner: root
    group: root
    mode: '0644'
  notify: Reload Systemd Daemon

- name: Flush handlers before running synchronization pipelines
  meta: flush_handlers

# --- HANDS-OFF INITIAL BOOTSTRAP STRATEGY ---
- name: Check if the certificate already exists locally in Stalwart
  stat:
    path: "{{ stalwart_certs_dir }}/{{ item.name }}.crt"
  loop: "{{ stalwart_domains }}"
  when: item.state == 'present'
  register: local_cert_stats

- name: Pause playbook to allow Caddy to solve initial ACME DNS challenges
  wait_for:
    path: "{{ caddy_certs_dir }}/{{ item.item.name }}/{{ item.item.name }}.crt"
    state: present
    timeout: 120
  loop: "{{ local_cert_stats.results }}"
  when: 
    - item.skipped is not defined
    - not item.stat.exists

- name: Force copy Caddy certificates to Stalwart directory
  copy:
    src: "{{ caddy_certs_dir }}/{{ item.0.name }}/{{ item.0.name }}.{{ 'crt' if item.1 == 'crt' else 'key' }}"
    dest: "{{ stalwart_certs_dir }}/{{ item.0.name }}.{{ item.1 }}"
    remote_src: true
    owner: "{{ stalwart_user }}"
    group: "{{ stalwart_group }}"
    mode: "{{ '0644' if item.1 == 'crt' else '0600' }}"
  loop: "{{ stalwart_domains | product(['crt', 'key']) | list }}"
  vars:
    match_stat: "{{ local_cert_stats.results | selectattr('item.name', 'equalto', item.0.name) | first }}"
  when: 
    - item.0.state == 'present'
    - (not match_stat.stat.exists) or (not match_stat.stat.exists is defined)

- name: Enable and start systemd path monitors for present domains
  service:
    name: "stalwart-cert-sync@{{ item.name }}.path"
    state: started
    enabled: true
  loop: "{{ stalwart_domains }}"
  when: item.state == 'present'

- name: Stop and disable systemd path monitors for absent domains
  service:
    name: "stalwart-cert-sync@{{ item.name }}.path"
    state: stopped
    enabled: false
  loop: "{{ stalwart_domains }}"
  when: item.state == 'absent'
  failed_when: false

- name: Purge systemd template unit instance symlinks from disk
  file:
    path: "/etc/systemd/system/multi-user.target.wants/stalwart-cert-sync@{{ item.name }}.path"
    state: absent
  loop: "{{ stalwart_domains }}"
  when: item.state == 'absent'
  notify: Reload Systemd Daemon

- name: Remove domain cert artifacts from Stalwart directory
  file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {%- set files = [] -%}
    {%- for domain in stalwart_domains if domain.state == 'absent' -%}
      {%- set _ = files.append(stalwart_certs_dir ~ '/' ~ domain.name ~ '.crt') -%}
      {%- set _ = files.append(stalwart_certs_dir ~ '/' ~ domain.name ~ '.key') -%}
    {%- endfor -%}
    {{ files }}

# ==============================================================================
# --- STALWART RUNTIME ENGINE SYNCHRONIZATION (PURE DECLARATIVE ATOMIC JMAP) ---
# ==============================================================================
- name: Compile unified Stalwart declarative blueprint in memory
  set_fact:
    stalwart_unified_ndjson: |-
      {# --- STAGE 1: DNS PROVIDERS (CENTRALIZED UNIQUE INSULATION) --- #}
      {% set active_dns_list = [] %}
      {% for d in stalwart_domains if d.state is defined and d.state == 'present' and d.dns is defined %}
        {% set _ = active_dns_list.append(d.dns | lower) %}
      {% endfor %}

      {# Generate single unified shared provider entry blocks natively #}
      {% set unique_dns = active_dns_list | unique | list %}
      {% for dns in unique_dns %}
      {% set provider_type = stalwart_dns_provider_map[dns] | default('') %}
      {% set caddy_creds = dns_key_map[dns] | default({}) %}
      {% if provider_type and caddy_creds.keys() | list | length > 0 %}
      {% set dns_fields = {"@type": provider_type, "description": dns | capitalize, "timeout": 30000} %}
      {% for key, val in caddy_creds.items() %}
        {% set provider_meta = stalwart_dns_field_meta[dns] | default({}) %}
        {% set field_rule = provider_meta[key] | default({}) %}
        {% set stalwart_key = field_rule.name | default(key) %}
        {% set stalwart_type = field_rule.type | default('String') %}
        {% if stalwart_type == 'SecretKey' %}
          {% set _ = dns_fields.update({stalwart_key: {"@type": "Value", "secret": val}}) %}
        {% else %}
          {% set _ = dns_fields.update({stalwart_key: val}) %}
        {% endif %}
      {% endfor %}
      {{ {"@type": "upsert", "object": "DnsServer", "matchOn": ["description"], "value": { "dns-" ~ (dns | lower): dns_fields }} | to_json }}
      {% endif %}
      {% endfor %}

      {# --- STAGE 2: CERTIFICATES --- #}
      {% set absent_certs = stalwart_domains | selectattr('state', 'defined') | selectattr('state', 'equalto', 'absent') | list %}
      {% if absent_certs | length > 0 %}
      {% for domain in absent_certs %}
      {{ {"@type": "destroy", "object": "Certificate", "ids": ["certificate-" ~ (domain.name | replace('.', '-'))]} | to_json }}
      {% endfor %}
      {% endif %}
      {% for domain in stalwart_domains if domain.state is defined and domain.state == 'present' %}
      {% set cert_slug = "certificate-" ~ (domain.name | replace('.', '-')) %}
      {% set san_map = {} %}
      {% set _ = san_map.update({domain.name: true}) %}
      {{ {
        "@type": "upsert",
        "object": "Certificate",
        "matchOn": ["subjectAlternativeNames"],
        "value": {
          cert_slug: {
            "certificate": {
              "@type": "File",
              "filePath": stalwart_certs_dir ~ "/" ~ domain.name ~ ".crt"
            },
            "privateKey": {
              "@type": "File",
              "filePath": stalwart_certs_dir ~ "/" ~ domain.name ~ ".key"
            },
            "subjectAlternativeNames": san_map
          }
        }
      } | to_json }}
      {% endfor %}

      {# --- STAGE 3: DOMAINS --- #}
      {% for domain in stalwart_domains if domain.state is defined and domain.state == 'absent' %}
      {{ {"@type": "destroy", "object": "Domain", "value": { "name": domain.name }} | to_json }}
      {% endfor %}
      {% for domain in stalwart_domains if domain.state is defined and domain.state == 'present' %}
      {% set cert_slug = "certificate-" ~ (domain.name | replace('.', '-')) %}
      {% set batch_dns_id = "\x23dns-" ~ (domain.dns | lower if domain.dns is defined else '') %}
      {% set batch_cert_id = "\x23" ~ cert_slug %}
      {{ {
        "@type": "upsert",
        "object": "Domain",
        "matchOn": ["name"],
        "value": {
          "domain-" ~ (domain.name | replace('.', '-')): {
            "name": domain.name,
            "certificateManagement": {
              "@type": "Manual",
              "certificateId": batch_cert_id
            },
            "dnsManagement": {
              "@type": "Automatic",
              "dnsServerId": batch_dns_id
            }
          }
        }
      } | to_json }}
      {% endfor %}

- name: Inspect unified Stalwart NDJSON deployment plan
  debug:
    var: stalwart_unified_ndjson

- name: Apply declarative Stalwart engine configuration
  command:
    argv: "{{ stalwart_cli_base + ['apply', '--stdin'] }}"
    stdin: "{{ stalwart_unified_ndjson }}"
  environment:
    STALWART_TOKEN: "{{ stalwart_api_token | default('') }}"
  register: stalwart_sync_result
  changed_when: 
    - "'\"created\":1' in stalwart_sync_result.stdout or '\"updated\":1' in stalwart_sync_result.stdout or '\"destroyed\":1' in stalwart_sync_result.stdout"