---
# --- CONFIGURATION GUARDRAILS ---
- name: Fail if any Stalwart domain contains an invalid state definition
  fail:
    msg: "Security Guardrail: Stalwart Domain '{{ item.name }}' specifies an unrecognized state."
  loop: "{{ stalwart_domains }}"
  when: item.state not in ['present', 'absent']

# --- DIRECTORY & ENVIRONMENT PREPARATION ---
- name: Ensure Caddy configuration layout directories exist
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /etc/systemd/system/caddy.service.d
    - "{{ caddy_conf_dir }}"

- name: Provision DNS API keys into Caddy service environment
  template:
    src: templates/caddy-dns-env.conf.j2
    dest: /etc/systemd/system/caddy.service.d/override.conf
    owner: root
    group: root
    mode: '0600'
  notify:
    - Reload Systemd Daemon
    - Restart Caddy

- name: Generate Master Caddyfile configuration
  template:
    src: templates/Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: root
    mode: '0644'
  notify: Reload Caddy

- name: Ensure Stalwart cert destination directory exists
  file:
    path: "{{ stalwart_certs_dir }}"
    state: directory
    owner: stalwart
    group: stalwart
    mode: '0750'

# --- INCLUDE-BASED CADDY SITES DEPLOYMENT ---
- name: Remove absent domains from Caddy configurations
  file:
    path: "{{ caddy_conf_dir }}/{{ item.name }}.conf"
    state: absent
  loop: "{{ stalwart_domains + caddy_domains }}"
  when: item.state == 'absent'
  notify: Reload Caddy

- name: Deploy Caddy site includes for Stalwart mail backends
  template:
    src: templates/caddy-stalwart-site.j2
    dest: "{{ caddy_conf_dir }}/{{ item.name }}.conf"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ stalwart_domains }}"
  when: item.state == 'present'
  notify: Reload Caddy

- name: Deploy Caddy site includes for Standalone Web domains
  template:
    src: templates/caddy-standalone-site.j2
    dest: "{{ caddy_conf_dir }}/{{ item.name }}.conf"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ caddy_domains }}"
  when: item.state == 'present'
  notify: Reload Caddy

# --- SYSTEMD TEMPLATE UNITS FOR MAIL CERTIFICATES ---
- name: Deploy systemd template units (Service)
  template:
    src: templates/stalwart-cert-sync@.service.j2
    dest: /etc/systemd/system/stalwart-cert-sync@.service
    owner: root
    group: root
    mode: '0644'
  notify: Reload Systemd Daemon

- name: Deploy systemd template units (Path)
  template:
    src: templates/stalwart-cert-sync@.path.j2
    dest: /etc/systemd/system/stalwart-cert-sync@.path
    owner: root
    group: root
    mode: '0644'
  notify: Reload Systemd Daemon

- name: Deploy standalone Stalwart status-aware reloading manager
  template:
    src: templates/stalwart-reload.service.j2
    dest: /etc/systemd/system/stalwart-reload.service
    owner: root
    group: root
    mode: '0644'
  notify: Reload Systemd Daemon

- name: Flush handlers before running synchronization pipelines
  meta: flush_handlers

# --- HANDS-OFF INITIAL BOOTSTRAP STRATEGY ---
- name: Check if the certificate already exists locally in Stalwart
  stat:
    path: "{{ stalwart_certs_dir }}/{{ item.name }}.crt"
  loop: "{{ stalwart_domains }}"
  when: item.state == 'present'
  register: local_cert_stats

- name: Pause playbook to allow Caddy to solve initial ACME DNS challenges
  wait_for:
    path: "{{ caddy_certs_dir }}/{{ item.item.name }}/{{ item.item.name }}.crt"
    state: present
    timeout: 120
  loop: "{{ local_cert_stats.results }}"
  when: 
    - item.skipped is not defined
    - not item.stat.exists

- name: Force copy Caddy certificates to Stalwart directory
  copy:
    src: "{{ caddy_certs_dir }}/{{ item.0.name }}/{{ item.0.name }}.{{ 'crt' if item.1 == 'crt' else 'key' }}"
    dest: "{{ stalwart_certs_dir }}/{{ item.0.name }}.{{ item.1 }}"
    remote_src: true
    owner: stalwart
    group: stalwart
    mode: "{{ '0644' if item.1 == 'crt' else '0600' }}"
  # Optimized Loop: Zip the stat results to check if copies are actually needed
  loop: "{{ stalwart_domains | product(['crt', 'key']) | list }}"
  vars:
    match_stat: "{{ local_cert_stats.results | selectattr('item.name', 'equalto', item.0.name) | first }}"
  when: 
    - item.0.state == 'present'
    - (not match_stat.stat.exists) or (not match_stat.stat.exists is defined)

- name: Enable and start systemd path monitors for present domains
  service:
    name: "stalwart-cert-sync@{{ item.name }}.path"
    state: started
    enabled: true
  loop: "{{ stalwart_domains }}"
  when: item.state == 'present'

# --- STALWART RUNTIME ENGINE SYNCHRONIZATION ---
- name: Create or update domains in Stalwart
  command:
    argv: >-
      {{
        stalwart_cli_base + [
          'create', 'Domain',
          '--field', 'name=' + item.name,
          '--field', 'certificateManagement={"@type":"Manual"}'
        ]
      }}
  environment:
    STALWART_TOKEN: "{{ stalwart_api_token | default('') }}"
  loop: "{{ stalwart_domains }}"
  when: item.state == 'present'
  register: domain_create_result
  failed_when: 
    - domain_create_result.rc != 0
    - "'primaryKeyViolation' not in domain_create_result.stderr"
  changed_when: "'primaryKeyViolation' not in domain_create_result.stderr"

- name: Get list of active certificate mappings from Stalwart
  command:
    argv: "{{ stalwart_cli_base + ['query', 'Certificate'] }}"
  environment:
    STALWART_TOKEN: "{{ stalwart_api_token | default('') }}"
  register: current_stalwart_certs
  changed_when: false
  when: stalwart_domains | selectattr('state', 'equalto', 'present') | list | length > 0

- name: Link certificates to domains in Stalwart
  command:
    argv: >-
      {{
        stalwart_cli_base + [
          'create', 'Certificate',
          '--field', 'certificate={"@type":"File","filePath":"' + stalwart_certs_dir + '/' + item.name + '.crt"}',
          '--field', 'privateKey={"@type":"File","filePath":"' + stalwart_certs_dir + '/' + item.name + '.key"}'
        ]
      }}
  environment:
    STALWART_TOKEN: "{{ stalwart_api_token | default('') }}"
  loop: "{{ stalwart_domains }}"
  when: 
    - item.state == 'present'
    - current_stalwart_certs.stdout is defined
    - item.name not in current_stalwart_certs.stdout
  register: cert_create_result
  failed_when: 
    - cert_create_result.rc != 0
    - "'primaryKeyViolation' not in cert_create_result.stderr"
  changed_when: "'primaryKeyViolation' not in cert_create_result.stderr"

# --- STEP 1: QUERY EXISTING DNS SERVERS ---
- name: Get list of existing DNS Servers from Stalwart
  command:
    argv: "{{ stalwart_cli_base + ['query', 'DnsServer'] }}"
  environment:
    STALWART_TOKEN: "{{ stalwart_api_token | default('') }}"
  register: current_dns_servers
  changed_when: false

# --- STEP 1.5: DYNAMIC VALIDATION GUARDRAIL ---
- name: Validate inventory keys against Stalwart metadata requirements
  vars:
    field_meta: "{{ stalwart_dns_field_meta[item] | default({}) }}"
    caddy_creds: "{{ dns_key_map[item] | default({}) }}"
    # Identify which metadata keys are completely missing from the user's inventory map
    missing_keys: >-
      {%- set missing = [] -%}
      {%- for expected_key in field_meta.keys() -%}
        {%- if expected_key not in caddy_creds -%}
          {%- set _ = missing.append(expected_key) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ missing }}
  assert:
    that:
      - (missing_keys | from_yaml | length) == 0
    fail_msg: |
      CRITICAL SCHEMA MISMATCH: The DNS credentials for provider '{{ item }}' are missing required parameters.
      Expected keys (from metadata): {{ field_meta.keys() | list }}
      Missing keys from your inventory: {{ missing_keys | from_yaml }}
      Currently defined keys in inventory: {{ caddy_creds.keys() | list if caddy_creds else 'None' }}
  loop: "{{ stalwart_domains | selectattr('state', 'equalto', 'present') | map(attribute='dns') | unique | list }}"
  when: 
    - stalwart_dns_field_meta[item] is defined

# --- STEP 2: PROVISION UNIQUE PROVIDERS ---
- name: Provision unique DNS Providers into Stalwart
  vars:
    provider_type: "{{ stalwart_dns_provider_map[item] | default('') }}"
    caddy_creds: "{{ dns_key_map[item] | default({}) }}"
    field_meta: "{{ stalwart_dns_field_meta[item] | default({}) }}"
    base_args:
      - 'create'
      - 'DnsServer'
      - '--field'
      - '@type={{ provider_type }}'
      - '--field'
      - 'description={{ item | capitalize }}'
    dynamic_fields: >-
      {%- set args_list = [] -%}
      {%- for meta_key, meta in field_meta.items() -%}
        {%- set val = caddy_creds[meta_key] | default('') -%}
        {%- if val | length > 0 -%}
          {%- if meta.type == 'SecretKey' -%}
            {%- set secret_value = {'@type': 'Value', 'secret': val} | to_json -%}
            {%- set _ = args_list.append('--field') -%}
            {%- set _ = args_list.append(meta.name + '=' + secret_value) -%}
          {%- else -%}
            {%- set _ = args_list.append('--field') -%}
            {%- set _ = args_list.append(meta.name + '=' + val) -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{ args_list }}
  command:
    argv: "{{ stalwart_cli_base + base_args + (dynamic_fields | from_yaml) }}"
  environment:
    STALWART_TOKEN: "{{ stalwart_api_token | default('') }}"
  loop: "{{ stalwart_domains | selectattr('state', 'equalto', 'present') | map(attribute='dns') | unique | list }}"
  when: 
    - provider_type | length > 0
    - caddy_creds.keys() | list | length > 0
    - current_dns_servers.stdout is defined
    - provider_type not in current_dns_servers.stdout

# --- STEP 3: RE-QUERY TO CAPTURE DYNAMIC IDs ---
- name: Refresh DNS Server list to capture newly generated IDs
  command:
    argv: "{{ stalwart_cli_base + ['query', 'DnsServer'] }}"
  environment:
    STALWART_TOKEN: "{{ stalwart_api_token | default('') }}"
  register: updated_dns_servers
  changed_when: false

- name: Query existing Stalwart domain internal IDs
  command:
    argv: "{{ stalwart_cli_base + ['query', 'Domain'] }}"
  environment:
    STALWART_TOKEN: "{{ stalwart_api_token | default('') }}"
  register: current_stalwart_domains
  changed_when: false

# --- STEP 4: LINK DOMAINS TO THE SHARED PROVIDERS ---
- name: Link Automatic DNS Management to existing Stalwart Domains
  vars:
    clean_domain_lines: "{{ current_stalwart_domains.stdout_lines | reject('search', 'Subject Alternative Names') | reject('search', 'Id') | list }}"
    matching_domain_line: "{{ (clean_domain_lines | select('search', item.name) | first) | default('') }}"
    resolved_domain_id: "{{ matching_domain_line.split() | first | default('') }}"
    
    target_provider: "{{ stalwart_dns_provider_map[item.dns] | default('') }}"
    clean_dns_lines: "{{ updated_dns_servers.stdout_lines | reject('search', 'DNS server type') | reject('search', 'Id') | list }}"
    matching_dns_line: "{{ (clean_dns_lines | select('search', target_provider) | first) | default('') }}"
    resolved_dns_id: "{{ matching_dns_line.split() | first | default('') }}"
  command:
    argv: >-
      {{
        stalwart_cli_base + [
          'update', 'Domain', resolved_domain_id,
          '--field', 'dnsManagement={"@type":"Automatic","dnsServerId":"' + resolved_dns_id + '"}'
        ]
      }}
  environment:
    STALWART_TOKEN: "{{ stalwart_api_token | default('') }}"
  loop: "{{ stalwart_domains }}"
  when:
    - item.state == 'present'
    - resolved_domain_id | length > 0
    - resolved_dns_id | length > 0

# --- CLEANUP (ABSENT) PIPELINE ---
- name: Get current domains from Stalwart to find target IDs
  command:
    argv: "{{ stalwart_cli_base + ['query', 'Domain'] }}"
  environment:
    STALWART_TOKEN: "{{ stalwart_api_token | default('') }}"
  register: current_domains
  changed_when: false
  when: stalwart_domains | selectattr('state', 'equalto', 'absent') | list | length > 0

- name: Run absent domain lifecycles
  include_tasks: tasks/purge_domain.yml
  loop: "{{ stalwart_domains }}"
  loop_control:
    loop_var: domain_item
  when: 
    - domain_item.state == 'absent'
    - current_domains.stdout is defined

- name: Stop and disable systemd path monitors for absent domains
  service:
    name: "stalwart-cert-sync@{{ item.name }}.path"
    state: stopped
    enabled: false
  loop: "{{ stalwart_domains }}"
  when: item.state == 'absent'
  failed_when: false

- name: Purge systemd template unit instance symlinks from disk
  file:
    path: "/etc/systemd/system/multi-user.target.wants/stalwart-cert-sync@{{ item.name }}.path"
    state: absent
  loop: "{{ stalwart_domains }}"
  when: item.state == 'absent'
  notify: Reload Systemd Daemon

- name: Remove domain cert artifacts from Stalwart directory
  file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {%- set files = [] -%}
    {%- for domain in stalwart_domains if domain.state == 'absent' -%}
      {%- set _ = files.append(stalwart_certs_dir ~ '/' ~ domain.name ~ '.crt') -%}
      {%- set _ = files.append(stalwart_certs_dir ~ '/' ~ domain.name ~ '.key') -%}
    {%- endfor -%}
    {{ files }}
