# --- Automation API & Binary Defaults ---
stalwart_api_token: "API_foobar"
stalwart_cli_path: "stalwart-cli"
stalwart_http_proxyv2_listener: "127.0.0.1:8008"

# --- Metadata Maps for Caddy and Stalwart Frameworks ---
stalwart_dns_provider_map:
  gandi: "GandiV5"
  hetzner: "Hetzner"
  spaceship: "Spaceship"
  porkbun: "Porkbun"
  ovh: "Ovh"
  dnsimple: "Dnsimple"

stalwart_dns_field_meta:
  gandi:
    bearer_token: { name: "secret", type: "SecretKey" }
  hetzner:
    api_token: { name: "secret", type: "SecretKey" }
  spaceship:
    apikey: { name: "apiKey", type: "String" }
    apisecret: { name: "secret", type: "SecretKey" }
  porkbun:
    api_key: { name: "apiKey", type: "String" }
    api_secret: { name: "secretApiKey", type: "SecretKey" }
  ovh:
    application_key: { name: "applicationKey", type: "String" }
    application_secret: { name: "applicationSecret", type: "SecretKey" }
    consumer_key: { name: "consumerKey", type: "SecretKey" }
  dnsimple:
    auth_token: { name: "authToken", type: "SecretKey" }
    account_id: { name: "accountIdentifier", type: "String" }

caddy_dns_field_map:
  gandi:
    layout: "anonymous"
  hetzner:
    layout: "anonymous"
  spaceship:
    layout: "block"
    fields:
      apikey: "api_key"
      apisecret: "api_secret"
  ovh:
    layout: "block"
    fields:
      application_key: "application_key"
      application_secret: "application_secret"
      consumer_key: "consumer_key"

# --- ACME Endpoint Config ---
# acme_directory_url: "https://acme-v02.api.letsencrypt.org/directory"
acme_directory_url: "https://acme-staging-v02.api.letsencrypt.org/directory"

# --- Storage Engine Core Paths ---
caddy_storage_base: "/var/lib/caddy/.local/share/caddy/certificates"
acme_host_slug: "{{ acme_directory_url | regex_replace('^https?://', '') | regex_replace('/.*$', '') }}-directory"
caddy_certs_dir: "{{ caddy_storage_base }}/{{ acme_host_slug }}"
stalwart_certs_dir: "/etc/stalwart/certs"
caddy_conf_dir: "/etc/caddy/conf.d"

# --- Dynamic Core Evaluation Engines ---
stalwart_api_url: >-
  https://{{ (stalwart_domains | selectattr('state', 'equalto', 'present') | map(attribute='name') | first) | default('127.0.0.1') }}/

stalwart_cli_base: >-
  {{
    [
      stalwart_cli_path,
      '--url', stalwart_api_url,
      '--insecure'
    ] + (
      ['--user', stalwart_admin_user, '--password', stalwart_admin_password]
      if (stalwart_api_token is not defined or not stalwart_api_token or stalwart_api_token | length == 0)
      else []
    )
  }}

# --- Example Custom systemd Service Overrides for Caddy ---
# Commented out so it remains an empty list option unless declared explicitly
caddy_service_override_lines: []
