---
stalwart_api_token: "API_FOOBAR"

stalwart_cli_path: "stalwart-cli"

stalwart_domains:
  - name: "domain.site"
    state: "present"
    dns: "hetzner"
    caddy_directive: |
       handle /foo {
         respond "Hello" 200
       }
       handle /bar/* {
         respond "Hello Bar" 200
       }

  - name: "domain.online"
    state: "present"
    dns: "spaceship"


caddy_domains:
  - name: "app.domain.site"
    state: "present"
    dns: "hetzner"
    caddy_directive: |
      respond "Hello World" 200

  - name: "webmail.domain.site"
    state: "present"
    dns: "hetzner"
    caddy_directive: |
      handle {
        reverse_proxy 127.0.0.1:3000
      }

  - name: "nomail.domain.example"
    state: "absent"
    dns: "gandi"



dns_key_map:
  gandi:
    secret: "FOOBAR"
  hetzner:
    secret: "BARQUX"
  spaceship:
    api_key: "QUUZ"
    api_secret: "FOOQUUZ"
  porkbun:
    apiKey: "porkbun_api_key_111222"
    secretApiKey: "porkbun_secret_api_key_333444"















# Mapping Caddy provider names to Stalwart's variant @types
stalwart_dns_provider_map:
  gandi: "GandiV5"
  dnsimple: "Dnsimple"


# Universal Translation Map for Stalwart
stalwart_dns_field_meta:
  gandi:
    api_token: { name: "secret", type: "SecretKey" }
  dnsimple:
    auth_token: { name: "authToken", type: "SecretKey" }
    account_id: { name: "accountIdentifier", type: "String" }

# Flat credential store for Caddyfile loops and Systemd env generation
dns_key_map:
  gandi:
    bearer_token: "gandi_token_abcdef12345"
  hetzner:
    api_token: "hetzner_token_789012"
  spaceship:
    apikey: "spaceship_api_key_xyz987"
    apisecret: "spaceship_secret_token_foo567"
  ovh:
    application_key: "ovh_app_key_123"
    application_secret: "ovh_app_secret_456"
    consumer_key: "ovh_consumer_key_789"

# Explicit Caddyfile structural layouts and internal directive names
caddy_dns_field_map:
  gandi:
    layout: "anonymous"
  hetzner:
    layout: "anonymous"
  spaceship:
    layout: "block"
    fields:
      apikey: "api_key"
      apisecret: "api_secret"
  ovh:
    layout: "block"
    fields:
      application_key: "application_key"
      application_secret: "application_secret"
      consumer_key: "consumer_key"













# UI / User Credentials (Kept for manual admin access)
#stalwart_admin_user: "admin"
#stalwart_admin_password: "your_secure_bootstrap_password"

# Automation API Token (Used exclusively by Ansible & Systemd)



# --- ACME Endpoint Config ---
# You can flip this to any custom CA endpoint string
# acme_directory_url: "https://acme-v02.api.letsencrypt.org/directory"
acme_directory_url: "https://acme-staging-v02.api.letsencrypt.org/directory"



# --- Storage Engine Core ---
caddy_storage_base: "/var/lib/caddy/.local/share/caddy/certificates"

# Automatically extract the dynamic domain folder slug from the URL string
acme_host_slug: "{{ acme_directory_url | regex_replace('^https?://', '') | regex_replace('/.*$', '') }}-directory"

# The final computed directory path used by your bootstrap loops
caddy_certs_dir: "{{ caddy_storage_base }}/{{ acme_host_slug }}"
stalwart_certs_dir: "/etc/stalwart/certs"


# Core connection parameters
# Where the CLI should connect (always passes through Caddy)
# Dynamically fall back to the first 'present' domain in your stalwart list
stalwart_api_url: >-
  https://{{ (stalwart_domains | selectattr('state', 'equalto', 'present') | map(attribute='name') | first) }}/

# Target directories and routing configurations
caddy_conf_dir: "/etc/caddy/conf.d"

# The backend port Caddy forwards traffic to
stalwart_http_proxyv2_listener: "127.0.0.1:8008"

# The Single Source of Truth for the binary execution array
stalwart_cli_base: >-
  [
  "{{ stalwart_cli_path | default('stalwart-cli') }}",
  "--url", "{{ stalwart_api_url }}",
  "--insecure",
  {% if stalwart_api_token is not defined or not stalwart_api_token %}
  "--user", "{{ stalwart_admin_user }}",
  "--password", "{{ stalwart_admin_password }}",
  {% endif %}
  ]


# Default Caddy proxy template string
caddy_default_reverse_proxy_lines:
  - "reverse_proxy {{ caddy_reverse_proxy_target }}"

# Custom systemd Service Overrides for Caddy
#caddy_service_override_lines: |
#  ExecStart=
#  ExecStart=/usr/local/bin/caddy run --environ --config /etc/caddy/Caddyfile
#  ExecReload=
#  ExecReload=/usr/local/bin/caddy reload  --config /etc/caddy/Caddyfile
caddy_service_override_lines: []
